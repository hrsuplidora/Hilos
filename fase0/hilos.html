<title>HILOS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Schibsted+Grotesk:wght@600;700;800&display=swap">
<style>
/* Layout: una sola columna de trabajo (máx. 1080px) con pestañas fijas arriba; la edición abre en una hoja que sube desde abajo en el celular y queda centrada en la computadora. Las "costuras" punteadas separan secciones: HILOS trata los temas como hilos de una tela. */
:root{
  --bg:#f4f5f8; --surface:#ffffff; --surface-2:#eceef4; --line:#d6dae4; --stitch:#b9bfd2;
  --ink:#191d2e; --ink-2:#464c63; --ink-3:#737a93;
  --accent:#34409c; --accent-ink:#ffffff; --accent-soft:#e4e7f7;
  --ok:#1d7349; --ok-soft:#dff0e7; --warn:#9a5b00; --warn-soft:#f9ecd4; --bad:#ad2a1f; --bad-soft:#f9e1de; --mute-soft:#e9ebf0;
  --f-display:"Schibsted Grotesk","IBM Plex Sans",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11131b; --surface:#191c27; --surface-2:#212535; --line:#2e3346; --stitch:#3c4259;
  --ink:#e7e9f1; --ink-2:#b5bacd; --ink-3:#8a90a8;
  --accent:#9aa5ff; --accent-ink:#0f1220; --accent-soft:#262c55;
  --ok:#64cf98; --ok-soft:#163024; --warn:#efb45c; --warn-soft:#382a13; --bad:#ff8f84; --bad-soft:#3b1b19; --mute-soft:#252937;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11131b; --surface:#191c27; --surface-2:#212535; --line:#2e3346; --stitch:#3c4259;
  --ink:#e7e9f1; --ink-2:#b5bacd; --ink-3:#8a90a8;
  --accent:#9aa5ff; --accent-ink:#0f1220; --accent-soft:#262c55;
  --ok:#64cf98; --ok-soft:#163024; --warn:#efb45c; --warn-soft:#382a13; --bad:#ff8f84; --bad-soft:#3b1b19; --mute-soft:#252937;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.wrap{max-width:1280px;margin:0 auto;padding-inline:16px;padding-block:0 64px}

/* Encabezado */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:1280px;margin:0 auto;padding-inline:16px;padding-block:12px 0;display:grid;gap:10px}
.brand{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.mark{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:.14em}
.mark span{color:var(--accent)}
.phase{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);border:1px dashed var(--stitch);border-radius:999px;padding:2px 8px}
.sync{font-size:12px;color:var(--ink-3);margin-left:auto}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-inline:-4px}
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;border:0;background:none;padding:8px 12px 10px;font-weight:600;font-size:14px;color:var(--ink-2);border-bottom:2px solid transparent;white-space:nowrap;cursor:pointer;display:flex;gap:6px;align-items:center}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.count{font-family:var(--f-mono);font-size:11px;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:0 6px;min-width:18px;text-align:center}
.count.zero{background:var(--mute-soft);color:var(--ink-3)}

/* Botones */
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:600;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;min-height:36px}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:4px 10px;min-height:30px;font-size:13px}

/* Encabezados de sección */
.page-h{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px;padding-block:22px 6px}
.page-h h1{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1.15;margin:0;text-wrap:balance}
.page-h .sub{color:var(--ink-3);font-size:13px;width:100%}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding-block:8px 4px}
.chip{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sec{padding-block:18px 4px;border-top:1px dashed var(--stitch);margin-top:14px}
.sec:first-of-type{border-top:0;margin-top:0}
.sec h2{font-family:var(--f-display);font-size:13px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2);margin:0 0 10px;display:flex;gap:8px;align-items:baseline}
.sec h2 .n{font-family:var(--f-mono);color:var(--ink-3);letter-spacing:0}
.empty{color:var(--ink-3);font-size:14px;padding:4px 0}
.lede{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;max-width:72ch}
.lede p{margin:0}

/* Filas de hilo */
.list{display:grid;gap:6px}
.row{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;cursor:pointer;text-align:left;width:100%}
.row:hover{border-color:var(--ink-3)}
.row .t{font-weight:600;min-width:0;overflow-wrap:anywhere}
.row .meta{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12.5px;color:var(--ink-3);align-items:center}
.row.sub{margin-left:22px;position:relative}
.row.sub::before{content:"";position:absolute;left:-14px;top:-7px;bottom:50%;width:10px;border-left:1px dashed var(--stitch);border-bottom:1px dashed var(--stitch);border-bottom-left-radius:6px}
.row .why{grid-column:1/-1;font-size:13px;color:var(--ink-2)}
.parent-ref{font-size:12px;color:var(--ink-3)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--mute-soft);color:var(--ink-2)}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.85}
.p-sin_iniciar{background:var(--mute-soft);color:var(--ink-2)}
.p-en_proceso{background:var(--accent-soft);color:var(--accent)}
.p-en_revision{background:var(--warn-soft);color:var(--warn)}
.p-completada{background:var(--ok-soft);color:var(--ok)}
.p-en_pausa{background:var(--mute-soft);color:var(--ink-3)}
.p-descartado{background:var(--mute-soft);color:var(--ink-3);text-decoration:line-through}
.p-decide{background:transparent;border:1px solid var(--warn);color:var(--warn)}
.p-decide::before{display:none}
.tag{font-size:12px;font-weight:600;color:var(--ink-2)}
.date-bad{color:var(--bad);font-weight:600}
.date-warn{color:var(--warn);font-weight:600}
.date-ok{color:var(--ok)}
.conf{font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em}

/* Tarjetas del borrador */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:8px}
.card h3{margin:0;font-size:15.5px;font-weight:600;line-height:1.35;overflow-wrap:anywhere}
.card .detail{margin:0;color:var(--ink-2);font-size:14px}
.quote{border-left:2px dashed var(--stitch);padding:2px 0 2px 10px;font-size:13px;color:var(--ink-2);font-style:italic;overflow-wrap:anywhere}
.quote .src{font-style:normal;font-size:12px;color:var(--ink-3);display:block;margin-top:2px}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.discard-form{display:flex;gap:6px;flex-wrap:wrap;align-items:center;background:var(--surface-2);border-radius:8px;padding:8px}
.discard-form select,.discard-form input{min-width:0;flex:1 1 160px}

/* Tabla de revisión del borrador */
.dtable{--dcols:minmax(0,1fr) 168px 148px 132px 168px 104px;display:grid;gap:8px}
.dhead{display:none}
.drow{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:grid;gap:10px 12px;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}
.drow.upd{border-style:dashed}
.drow .c-task{grid-column:1/-1}
.drow .c-act{grid-column:1/-1;display:flex;gap:6px;justify-content:flex-end}
.cell{display:grid;gap:4px;min-width:0}
.cl{font-size:11px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em}
.in{width:100%;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-height:36px;font-size:14px}
.in:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 2px var(--accent-soft)}
.in.dirty{border-color:var(--warn);background:var(--warn-soft)}
.in.empty{color:var(--ink-3)}
textarea.t-in{font-weight:600;resize:vertical;line-height:1.35;min-height:54px}
.t-ro{margin:0;font-weight:600}
.ro{font-size:14px;color:var(--ink-2);padding-top:6px}
.chg{margin:0;font-size:13px;font-weight:600;color:var(--accent)}
.dchips{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--ink-3);align-items:center}
.ctx-box{display:grid;gap:6px}
.ctx{margin:0;font-size:13px;color:var(--ink-2)}
.ctx.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.more{appearance:none;background:none;border:0;padding:0;color:var(--accent);font-size:12.5px;cursor:pointer;justify-self:start}
.toast .undo{appearance:none;margin-left:12px;background:none;border:0;color:var(--accent-soft);font-weight:700;text-decoration:underline;cursor:pointer;font-size:14px}
@media (min-width:900px){
  .dhead{display:grid;grid-template-columns:var(--dcols);gap:12px;padding:0 13px;font-size:11px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.07em}
  .drow{grid-template-columns:var(--dcols)}
  .drow .c-task{grid-column:auto}
  .drow .c-act{grid-column:auto;flex-direction:column;align-items:stretch;padding-top:0}
  .drow .cl{display:none}
  .drow .c-task>.cl{display:none}
}

/* Resumen por puesto */
.grid-sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
.sum{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer;text-align:left;display:grid;gap:8px}
.sum:hover{border-color:var(--ink-3)}
.sum .name{font-weight:700;font-family:var(--f-display);font-size:16px}
.sum dl{display:grid;grid-template-columns:1fr auto;gap:2px 10px;margin:0;font-size:13px}
.sum dt{color:var(--ink-3)}
.sum dd{margin:0;text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:500}
.sum dd.hot{color:var(--bad);font-weight:600}
.qs{margin:0;padding-left:20px;display:grid;gap:6px;max-width:75ch}

/* Herramientas de lista */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-block:6px 4px}
.toolbar input[type=search],.toolbar select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px;min-height:36px;min-width:0}
.toolbar input[type=search]{flex:1 1 200px}
.check{display:inline-flex;gap:6px;align-items:center;font-size:14px;color:var(--ink-2)}
.group-h{display:flex;gap:8px;align-items:baseline;margin:16px 0 8px;font-weight:700;font-family:var(--f-display);font-size:16px}
.group-h .n{font-family:var(--f-mono);font-size:12px;color:var(--ink-3);font-weight:400}

/* Tablas */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);font-weight:600;white-space:nowrap}
td.num,th.num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}

/* Hoja de edición */
.scrim{position:fixed;inset:0;background:rgba(10,12,20,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:14px}
@media (min-width:760px){.scrim{align-items:center}.sheet{border-radius:16px;max-height:88vh;padding:22px 24px}}
.sheet-h{display:flex;gap:10px;align-items:center}
.sheet-h h2{margin:0;font-family:var(--f-display);font-size:20px;flex:1}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form .full{grid-column:1/-1}
@media (max-width:560px){.form{grid-template-columns:1fr}}
.field{display:grid;gap:4px;min-width:0}
.field label,.field .lbl{font-size:12px;font-weight:600;color:var(--ink-2);letter-spacing:.02em}
.field input,.field select,.field textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:38px;width:100%;min-width:0}
.field textarea{min-height:84px;resize:vertical}
.hint{font-size:12px;color:var(--ink-3)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg label{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:13px;cursor:pointer;background:var(--bg)}
.seg input{accent-color:var(--accent)}
.box{border:1px dashed var(--stitch);border-radius:var(--r);padding:12px;display:grid;gap:10px}
.box h3{margin:0;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);font-family:var(--f-display)}
.hist{margin:0;padding:0;list-style:none;display:grid;gap:4px;font-size:13px;color:var(--ink-2)}
.hist .when{font-family:var(--f-mono);font-size:11.5px;color:var(--ink-3);margin-right:6px}
.sheet-f{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;position:sticky;bottom:calc(-18px - env(safe-area-inset-bottom,0px));background:var(--surface);padding-block:10px 0;border-top:1px solid var(--line)}

/* Avisos */
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:60;max-width:calc(100vw - 32px)}
.notice{background:var(--warn-soft);color:var(--ink);border-radius:var(--r);padding:12px 14px;margin-top:16px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(16px);opacity:.6}to{transform:none;opacity:1}}}
</style>

<header class="top">
  <div class="top-in">
    <div class="brand">
      <div class="mark">HILOS<span>.</span></div>
      <div class="phase">Fase 0 · prototipo</div>
      <div class="sync" id="sync">Conectando…</div>
      <button class="btn primary sm" id="btn-new" type="button">+ Hilo</button>
    </div>
    <nav class="tabs" role="tablist" id="tabs"></nav>
  </div>
</header>
<main class="wrap" id="main"><p class="empty" style="padding-top:24px">Cargando HILOS…</p></main>
<div id="layer"></div>

<script>
"use strict";
/* ---------- Catálogos ---------- */
const IMPL = {sin_iniciar:"Sin iniciar",en_proceso:"En proceso",en_revision:"En revisión",completada:"Completada",en_pausa:"En pausa",descartado:"Descartado"};
const DEC = {por_decidir:"Por decidir",decidido:"Decidido",no_requiere:"No requiere decisión"};
const RES = {sin_medir:"Sin medir",logrado:"Logrado",parcial:"Parcial",no_logrado:"No logrado"};
const TIPO = {tarea:"Tarea",decision:"Decisión",proyecto:"Proyecto",idea:"Idea",indicador:"Indicador",riesgo:"Riesgo"};
const ENTREGA = {a_tiempo:"A tiempo",tarde_justificado:"Tarde – Justificado",tarde_injustificado:"Tarde – Injustificado"};
const EJEC = {mejor:"Mejor de lo esperado",esperado:"Lo esperado",menos:"Menos de lo esperado"};
const AREAS = ["Gerencia","Comercial","Operaciones","RRHH","Contabilidad"];
const MOTIVOS = ["No es un tema de seguimiento","Ya está resuelto","Duplicado","No me corresponde","Otro"];
const TABS = [["lunes","Publicación"],["borrador","Borrador"],["hilos","Hilos"],["desempeno","Desempeño"],["puestos","Puestos"],["ayuda","Cómo se usa"]];

/* ---------- Estado ---------- */
const S = {puestos:new Map(),hilos:new Map(),borrador:new Map(),pub:null,ingesta:null,
  tab:"lunes",rama:"consolidado",loaded:{p:false,h:false,b:false},
  f:{q:"",puesto:"todos",agrupar:"area",cerrados:false},
  per:"90",fb:"todos"};
let db = null;
try{const t=localStorage.getItem("hilos.tab");if(t&&TABS.some(x=>x[0]===t))S.tab=t;}catch(e){}

/* ---------- Utilidades ---------- */
function h(tag,props,...kids){const el=document.createElement(tag);
  if(props)for(const[k,v]of Object.entries(props)){if(v==null||v===false)continue;
    if(k==="class")el.className=v;else if(k==="text")el.textContent=v;
    else if(k.startsWith("on")&&typeof v==="function")el.addEventListener(k.slice(2),v);
    else el.setAttribute(k,v===true?"":String(v));}
  for(const c of kids.flat(Infinity)){if(c==null||c===false)continue;el.append(c instanceof Node?c:document.createTextNode(String(c)));}
  return el;}
const TZ="America/Costa_Rica";
const ymd=new Intl.DateTimeFormat("en-CA",{timeZone:TZ,year:"numeric",month:"2-digit",day:"2-digit"});
function hoy(){return ymd.format(new Date());}
function fechaDe(iso){if(!iso)return null;const d=new Date(iso);return isNaN(d)?String(iso).slice(0,10):ymd.format(d);}
function addDays(d,n){const t=new Date(d+"T12:00:00Z");t.setUTCDate(t.getUTCDate()+n);return t.toISOString().slice(0,10);}
function dias(a,b){return Math.round((Date.parse(b+"T00:00:00Z")-Date.parse(a+"T00:00:00Z"))/864e5);}
const MESES=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
function fmt(d){if(!d)return"—";const[y,m,dd]=String(d).slice(0,10).split("-");return `${+dd} ${MESES[+m-1]}`;}
function fmtLargo(d){try{return new Intl.DateTimeFormat("es-CR",{timeZone:"UTC",weekday:"long",day:"numeric",month:"long",year:"numeric"}).format(new Date(d+"T12:00:00Z"));}catch(e){return d;}}
function fmtHora(iso){try{return new Intl.DateTimeFormat("es-CR",{timeZone:TZ,day:"numeric",month:"short",hour:"numeric",minute:"2-digit"}).format(new Date(iso));}catch(e){return iso;}}
function nuevoId(p){return p+"-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,7);}
function safeUrl(u){try{const x=new URL(u);if(x.protocol!=="https:")return null;
  return /(^|\.)(office365\.com|office\.com|outlook\.com|microsoft\.com|sharepoint\.com|slack\.com)$/i.test(x.hostname)?x.href:null;}catch(e){return null;}}
function toast(msg,undo){document.querySelectorAll(".toast").forEach(x=>x.remove());
  const t=h("div",{class:"toast",role:"status"},msg);
  if(undo){const b=h("button",{type:"button",class:"undo"},"Deshacer");b.addEventListener("click",async()=>{t.remove();try{await undo();toast("Cambio deshecho");}catch(e){toast("No se pudo deshacer");}});t.append(b);}
  document.body.append(t);setTimeout(()=>t.remove(),undo?7000:3200);}
function puestoNombre(id){if(!id)return"Sin responsable";if(id==="tercero")return"Un tercero";return S.puestos.get(id)?.nombre||id;}
function reportesGG(){return[...S.puestos.entries()].filter(([,p])=>p.reportaGG).sort((a,b)=>(a[1].orden??99)-(b[1].orden??99));}
function rama(pid){if(!pid||pid==="consolidado"||pid==="todos")return null;const out=new Set([pid]);let more=true;

/* ---------- Arranque ---------- */
document.getElementById("btn-new").addEventListener("click",()=>{if(db)openEditor(null,{});});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeLayer();});
function fail(msg){const m=document.getElementById("main");m.replaceChildren(h("div",{class:"notice"},msg));document.getElementById("sync").textContent="Sin conexión";}
async function boot(){
  renderTabs();
  if(!window.claude||typeof window.claude.use!=="function"){fail("HILOS guarda sus datos en claude.ai. Abra esta página desde su cuenta de Claude para ver y editar los hilos.");return;}
  try{db=await window.claude.use("db");}catch(e){db=null;}
  if(!db){fail("No se pudo conectar con la base de datos de HILOS. Recargue la página; si el problema sigue, revise los permisos de la página en su cuenta de Claude.");return;}
  const err=e=>{toast("Error de conexión: "+(e?.code||"desconocido"));};
  db.collection("puestos").onSnapshot(s=>{S.puestos=new Map(s.docs.map(d=>[d.id,d.data()]));S.loaded.p=true;render();},err);
  db.collection("hilos").onSnapshot(s=>{S.hilos=new Map(s.docs.map(d=>[d.id,d.data()]));S.loaded.h=true;render();},err);
  db.collection("borrador").where("estado","==","pendiente").onSnapshot(s=>{S.borrador=new Map(s.docs.map(d=>[d.id,d.data()]));S.loaded.b=true;render();},err);
  db.collection("publicaciones").orderBy("fecha","desc").limit(1).onSnapshot(s=>{S.pub=s.docs[0]?.data()||null;render();},err);
  db.doc("estado/ingesta").onSnapshot(s=>{S.ingesta=s.exists?s.data():null;renderSync();},err);}
boot();
</script>
